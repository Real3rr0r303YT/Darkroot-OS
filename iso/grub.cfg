set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
set color_normal=light-gray/black
set color_highlight=white/magenta
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta

search --no-floppy --set=root --label @LABEL@

menuentry "Darkroot OS @VERSION@  (live)" {
    linux /boot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 init=/sbin/runit-init quiet splash
    initrd /boot/initramfs.img
}

menuentry "Darkroot OS @VERSION@  (live, safe graphics)" {
    linux /boot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 init=/sbin/runit-init nomodeset
    initrd /boot/initramfs.img
}

menuentry "Darkroot OS @VERSION@  (live, copy to RAM)" {
    linux /boot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.ram=1 rd.live.overlay.overlayfs=1 init=/sbin/runit-init quiet
    initrd /boot/initramfs.img
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" { fwsetup }
fi
menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
