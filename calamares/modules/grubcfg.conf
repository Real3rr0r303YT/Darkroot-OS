---
overwrite: false
prefer_grub_d: false
keepDistributor: false
kernel_params: [ "init=/sbin/runit-init", "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TIMEOUT_STYLE: "menu"
    GRUB_DISABLE_OS_PROBER: "false"
    GRUB_THEME: "/usr/share/grub/themes/darkroot/theme.txt"
    GRUB_GFXMODE: "1920x1080,1280x720,auto"
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
