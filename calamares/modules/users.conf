---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - audio
    - video
    - input
    - usb
    - cdrom
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
    forbidden_names: [ root, darkroot ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "darkroot-${cpu}"
