# Darkroot OS - Calamares installer configuration
---
modules-search: [ local, /usr/lib64/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id:     edition
  module: packagechooser
  config: packagechooser-edition.conf
- id:     hacker
  module: packagechooser
  config: packagechooser-hacker.conf
- id:     edition
  module: contextualprocess
  config: contextualprocess-edition.conf
- id:     hacker
  module: contextualprocess
  config: contextualprocess-hacker.conf
- id:     prepare
  module: shellprocess
  config: shellprocess-prepare.conf
- id:     finalize
  module: shellprocess
  config: shellprocess-finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@edition
  - packagechooser@hacker
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - networkcfg
  - shellprocess@prepare
  - contextualprocess@edition
  - contextualprocess@hacker
  - shellprocess@finalize
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: darkroot
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
