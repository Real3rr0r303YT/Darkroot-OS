# Darkroot Shell lock screen
general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 110
    font_family = Inter Display SemiBold
    position = 0, 260
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.9)
    font_size = 24
    font_family = Inter Medium
    position = 0, 170
    halign = center
    valign = center
}

input-field {
    size = 260, 40
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgba(255, 255, 255, 1)
    placeholder_text = Enter Password
    fade_on_empty = false
    rounding = 20
    position = 0, -160
    halign = center
    valign = center
}
